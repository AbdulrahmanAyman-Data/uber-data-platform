x-logging: &default-logging
  # log rotation
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:

  # =========================================================
  # HADOOP (HDFS + YARN) — same master/slave pattern as the NYC project
  # =========================================================
  uber-hadoop-master:
    build:
      context: ./docker/hadoop
      dockerfile: Dockerfile.master
    image: uber-hadoop-base-master
    container_name: uber-hadoop-master
    hostname: uber-hadoop-master
    networks:
      - uber-network
    volumes:
      - uber_hadoop_data_master:/opt/hadoop
      - ./scripts:/opt/scripts
    ports:
      - "9870:9870"   # HDFS NameNode UI
      - "8088:8088"   # YARN ResourceManager UI
      - "9000:9000"   # HDFS RPC
    logging: *default-logging
    command: ["/bin/bash", "-c", "service ssh start && /entrypoint.sh && tail -f /dev/null"]

  uber-hadoop-slave1:
    build:
      context: ./docker/hadoop
      dockerfile: Dockerfile.slave
    image: uber-hadoop-slave-image
    container_name: uber-hadoop-slave1
    hostname: uber-hadoop-slave1
    networks:
      - uber-network
    volumes:
      - uber_hadoop_data_slave1:/opt/hadoop
    logging: *default-logging
    command: ["/bin/bash", "-c", "service ssh start && /opt/hadoop/sbin/hadoop-daemon.sh start datanode && /opt/hadoop/bin/yarn nodemanager && tail -f /dev/null"]

  uber-hadoop-slave2:
    build:
      context: ./docker/hadoop
      dockerfile: Dockerfile.slave
    image: uber-hadoop-slave-image
    container_name: uber-hadoop-slave2
    hostname: uber-hadoop-slave2
    networks:
      - uber-network
    volumes:
      - uber_hadoop_data_slave2:/opt/hadoop
    logging: *default-logging
    command: ["/bin/bash", "-c", "service ssh start && /opt/hadoop/sbin/hadoop-daemon.sh start datanode && /opt/hadoop/bin/yarn nodemanager && tail -f /dev/null"]

  # =========================================================
  # POSTGRES — Hive Metastore + Airflow + Superset (same shared-instance pattern)
  # =========================================================
  uber-postgres:
    image: postgres:13-alpine
    container_name: uber-postgres
    hostname: uber-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: postgres
      POSTGRES_APPS: "metastore_db:hive:hivepassword,airflow_db:airflow:airflowpassword,superset_db:superset:supersetpassword"
    ports:
      - "5432:5432"
    volumes:
      - uber_postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres/init-app-databases.sh:/docker-entrypoint-initdb.d/init-app-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging
    networks:
      - uber-network

  # =========================================================
  # HIVE METASTORE
  # =========================================================
  uber-hive-metastore:
    image: apache/hive:3.1.3
    container_name: uber-hive-metastore
    hostname: uber-hive-metastore
    restart: unless-stopped
    depends_on:
      uber-postgres:
        condition: service_healthy
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      IS_RESUME: "true"
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://uber-postgres:5432/metastore_db
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hivepassword
    ports:
      - "9083:9083"
    volumes:
      - ./config/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
      - ./config/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml
      - ./config/hadoop/hive-site.xml:/opt/hive/conf/hive-site.xml
      - ./drivers/postgresql-42.7.3.jar:/opt/hive/lib/postgres.jar
    logging: *default-logging
    networks:
      - uber-network

  # =========================================================
  # TRINO
  # =========================================================
  uber-trino:
    image: trinodb/trino:latest
    container_name: uber-trino
    hostname: uber-trino
    restart: unless-stopped
    depends_on:
      - uber-hive-metastore
    ports:
      - "8085:8080"
    volumes:
      - ./config/trino:/etc/trino
      - ./config/hadoop:/opt/hadoop/etc/hadoop
    logging: *default-logging
    networks:
      - uber-network

  # =========================================================
  # NIFI — Ingestion layer
  # =========================================================
  uber-nifi:
    build:
      context: ./docker/nifi
    image: uber-nifi
    container_name: uber-nifi
    hostname: uber-nifi
    restart: unless-stopped
    environment:
      NIFI_WEB_HTTP_PORT: 8443
    ports:
      - "8443:8443"
    volumes:
    - uber_nifi_state:/opt/nifi/nifi-current/state
    - uber_nifi_database_repository:/opt/nifi/nifi-current/database_repository
    - uber_nifi_flowfile_repository:/opt/nifi/nifi-current/flowfile_repository
    - uber_nifi_content_repository:/opt/nifi/nifi-current/content_repository
    - uber_nifi_provenance_repository:/opt/nifi/nifi-current/provenance_repository
    - ./nifi/templates:/opt/nifi/nifi-current/conf/templates
    - ./docker/hadoop:/opt/nifi/nifi-current/hadoop-conf
    - ./scripts:/opt/nifi/project-scripts      
    - ./nifi/rides-source:/opt/nifi/nifi-current/rides-source
    - ./nifi/reference-source:/opt/nifi/nifi-current/reference-source
    logging: *default-logging
    networks:
      - uber-network

  # =========================================================
  # SPARK — Batch processing
  # =========================================================
  uber-spark-master:
    image: bde2020/spark-master:3.3.0-hadoop3.3
    container_name: uber-spark-master
    hostname: uber-spark-master
    environment:
      - INIT_DAEMON_STEP=setup_spark
    ports:
      - "8081:8080"   # Spark master UI
      - "7077:7077"
    volumes:
      - ./batch:/spark-jobs/batch
      - ./common:/spark-jobs/common
      - ./config/hadoop:/spark-hadoop-conf
    logging: *default-logging
    networks:
      - uber-network

  uber-spark-worker:
    image: bde2020/spark-worker:3.3.0-hadoop3.3
    container_name: uber-spark-worker
    hostname: uber-spark-worker
    depends_on:
      - uber-spark-master
    environment:
      - SPARK_MASTER=spark://uber-spark-master:7077
      - SPARK_WORKER_MEMORY=3g
    ports:
      - "8082:8081"   # Spark worker UI
    volumes:
      - ./batch:/spark-jobs/batch
      - ./common:/spark-jobs/common
      - ./config/hadoop:/spark-hadoop-conf
    logging: *default-logging
    networks:
      - uber-network

  # =========================================================
  # JUPYTER — Notebook environment
  # =========================================================
  uber-jupyter:
    build:
      context: ./docker/spark
      dockerfile: Dockerfile.jupyter
    image: uber-jupyter-image
    container_name: uber-jupyter
    hostname: uber-jupyter
    depends_on:
      - uber-spark-master
    ports:
      - "8888:8888"   # JupyterLab UI
    volumes:
      - ./docker/spark/notebooks:/opt/notebooks
      - ./batch:/opt/notebooks/batch
      - ./common:/opt/notebooks/common
      - ./config/hadoop:/opt/notebooks/hadoop-conf
    logging: *default-logging
    networks:
      - uber-network

  # =========================================================
  # AIRFLOW — Orchestration (Airflow 3.x)
  # =========================================================
  uber-airflow-init:
    build:
      context: ./docker/airflow
      dockerfile: Dockerfile.airflow
    image: uber-airflow-image
    container_name: uber-airflow-init
    depends_on:
      uber-postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://uber-airflow-api-server:8080/execution/"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflowpassword@uber-postgres:5432/airflow_db
      AIRFLOW__API_AUTH__JWT_SECRET: "change-me-to-a-random-static-secret"
    entrypoint: /bin/bash
    command: -c "airflow db migrate && airflow users create --username airflow --password airflow --firstname airflow --lastname airflow --role Admin --email airflow@example.com || true"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./batch:/opt/airflow/batch
      - ./common:/opt/airflow/common
    logging: *default-logging
    networks:
      - uber-network

  uber-airflow-api-server:
    build:
      context: ./docker/airflow
      dockerfile: Dockerfile.airflow
    image: uber-airflow-image
    container_name: uber-airflow-api-server
    hostname: uber-airflow-api-server
    restart: unless-stopped
    depends_on:
      uber-airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://uber-airflow-api-server:8080/execution/"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflowpassword@uber-postgres:5432/airflow_db
      AIRFLOW__API_AUTH__JWT_SECRET: "change-me-to-a-random-static-secret"
    ports:
      - "8090:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - uber_airflow_logs:/opt/airflow/logs
      - ./batch:/opt/airflow/batch
      - ./common:/opt/airflow/common
    command: api-server
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/api/v2/monitor/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *default-logging
    networks:
      - uber-network

  uber-airflow-scheduler:
    build:
      context: ./docker/airflow
      dockerfile: Dockerfile.airflow
    image: uber-airflow-image
    container_name: uber-airflow-scheduler
    hostname: uber-airflow-scheduler
    restart: unless-stopped
    depends_on:
      uber-airflow-init:
        condition: service_completed_successfully
      uber-airflow-api-server:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://uber-airflow-api-server:8080/execution/"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflowpassword@uber-postgres:5432/airflow_db
      AIRFLOW__API_AUTH__JWT_SECRET: "change-me-to-a-random-static-secret"
      AIRFLOW_CONN_SPARK_DEFAULT: "spark://uber-spark-master:7077"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - uber_airflow_logs:/opt/airflow/logs
      - ./batch:/opt/airflow/batch
      - ./common:/opt/airflow/common
    command: scheduler
    logging: *default-logging
    networks:
      - uber-network

  uber-airflow-dag-processor:
    build:
      context: ./docker/airflow
      dockerfile: Dockerfile.airflow
    image: uber-airflow-image
    depends_on:
      uber-airflow-init:
        condition: service_completed_successfully
      uber-airflow-api-server:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://uber-airflow-api-server:8080/execution/"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflowpassword@uber-postgres:5432/airflow_db
      AIRFLOW__API_AUTH__JWT_SECRET: "change-me-to-a-random-static-secret"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    command: dag-processor
    logging: *default-logging
    networks:
      - uber-network

  # =========================================================
  # SUPERSET — Visualization
  # =========================================================
  uber-superset-init:
    build:
      context: ./docker/superset
    image: uber-superset-image
    container_name: uber-superset-init
    depends_on:
      uber-postgres:
        condition: service_healthy
    environment:
      SUPERSET_SECRET_KEY: "change_me_to_a_random_value"
    volumes:
      - ./config/superset/superset_config.py:/app/pythonpath/superset_config.py
    entrypoint: /bin/bash
    command: -c "superset db upgrade && superset fab create-admin --username superset --firstname superset --lastname superset --email superset@example.com --password supersetpassword && superset init"
    logging: *default-logging
    networks:
      - uber-network

  uber-superset:
    build:
      context: ./docker/superset
    image: uber-superset-image
    container_name: uber-superset
    hostname: uber-superset
    restart: unless-stopped
    depends_on:
      uber-superset-init:
        condition: service_completed_successfully
      uber-trino:
        condition: service_started
    environment:
      SUPERSET_SECRET_KEY: "change_me_to_a_random_value"
    ports:
      - "8089:8088"
    volumes:
      - ./config/superset/superset_config.py:/app/pythonpath/superset_config.py
      - uber_superset_home:/app/superset_home
    logging: *default-logging
    networks:
      - uber-network

networks:
  uber-network:
    driver: bridge

volumes:
  uber_hadoop_data_master:
  uber_hadoop_data_slave1:
  uber_hadoop_data_slave2:
  uber_postgres_data:
  uber_nifi_state:
  uber_nifi_database_repository:
  uber_nifi_flowfile_repository:
  uber_nifi_content_repository:
  uber_nifi_provenance_repository:
  uber_airflow_logs:
  uber_superset_home:
